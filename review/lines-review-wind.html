<!doctype html>
<meta charset="utf-8">
<title>PW — bespoke lines, set-001</title>
<link rel="stylesheet" href="../assets/type-prototype-caption.css">
<style>
  :root { --bg:#14110d; --panel:#1f1a14; --ink:#fffaf3; --ink2:#b5ab9d; --gold:#ffd700; --yes:#63c98a; --no:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:10; background:rgba(20,17,13,.97); border-bottom:1px solid rgba(246,242,232,.14);
           padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0 8px 0 0; }
  button { font:inherit; border:1px solid rgba(246,242,232,.18); background:var(--panel); color:var(--ink);
           border-radius:8px; padding:6px 11px; cursor:pointer; }
  button:hover { border-color:var(--gold); }
  button.primary { background:var(--gold); color:#1a1a2e; border-color:var(--gold); font-weight:700; }
  .tally { color:var(--ink2); font-variant-numeric:tabular-nums; }
  main { padding:18px; display:flex; flex-direction:column; gap:30px; }
  .card { display:grid; grid-template-columns:auto 1fr; gap:22px; border-top:1px solid rgba(246,242,232,.12); padding-top:18px; }
  .hero { position:relative; overflow:hidden; background-size:cover; background-repeat:no-repeat;
          border-radius:0 0 20px 20px; box-shadow:0 18px 44px rgba(0,0,0,.55); }
  .cap { position:absolute; left:0; right:0; bottom:0; margin:0; color:#fff; font-weight:700;
         font-family:'Caveat Prototype','Segoe Print','Bradley Hand',cursive; text-align:left; line-height:1.08;
         text-shadow:0 2px 14px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.8); }
  .meta { color:var(--ink2); font-size:12.5px; margin-bottom:10px; }
  .meta b { color:var(--ink); }
  .seen { color:var(--ink2); font-size:12.5px; max-width:80ch; margin:0 0 12px; font-style:italic; }
  .note { color:#ffb84d; font-size:12.5px; max-width:80ch; margin:0 0 12px; }
  .line { display:flex; gap:8px; align-items:flex-start; margin-bottom:7px; }
  .line input[type=text] { flex:1; min-width:0; font:inherit; background:#181410; color:var(--ink);
      border:1px solid rgba(246,242,232,.16); border-radius:7px; padding:7px 10px; }
  .line input[type=text]:focus { outline:none; border-color:var(--gold); }
  .line .n { width:18px; color:var(--ink2); font-variant-numeric:tabular-nums; padding-top:8px; }
  .line .wc { width:58px; color:var(--ink2); font-size:11.5px; padding-top:9px; text-align:right; }
  .y.on { border-color:var(--yes); color:var(--yes); font-weight:700; }
  .n2.on { border-color:var(--no); color:var(--no); font-weight:700; }
  .line.mine input[type=text] { border-style:dashed; }
  .line .resc { flex:none; align-self:flex-start; margin-top:8px; font-size:10.5px; letter-spacing:.06em;
      text-transform:uppercase; color:#8fb7ff; border:1px solid #8fb7ff55; border-radius:5px; padding:1px 5px; }
  .hint { color:var(--ink2); font-size:12px; margin:10px 0 0; max-width:80ch; }
</style>

<header>
  <h1>Bespoke lines — wind, 12 photographs, five each</h1>
  <span class="tally" id="tally"></span>
  <span style="flex:1"></span>
  <button id="export" class="primary">Export</button>
</header>
<main id="main"></main>

<script>
const DATA = {"box":{"w":327,"h":518},"cap":{"runway":56.84,"font":33.00000000000001,"padBottom":14.616000000000001},"bucket":"wind","images":[{"index":1,"image":"wind/week_1/dawn/2.webp","hash":"c121631aca0a","condition":"wind","time":"dawn","week":"A","day":"mon","paths":["wind/week_1/dawn/2.webp","wind/week_3/dawn/2.webp"],"why":"no bespoke line yet — served the condition bank","place":null,"pass1":"3 bank lines approved on this slot","seen":"One tall palm alone on a suburban verge at sunrise, trunk permanently leaning, every frond swept to one side and held there. Low sun burning through broken cloud, mountain range on the right, single-storey houses and streetlights along an empty road, haze blowing across the tar.","note":null,"lines":["The trees are doing involuntary yoga.","That trunk grew crooked because this happens here far more than it doesn't.","The palm has been holding that exact shape since about three this morning.","The Cape Doctor is making house calls.","The sun is up, the street is empty, and the wind got here first."],"rescue":["witty:wind#6",null,null,"witty:wind#3",null]},{"index":2,"image":"wind/week_1/dawn/5.webp","hash":"337d1a2fe2c2","condition":"wind","time":"dawn","week":"A","day":"sun","paths":["wind/week_1/dawn/5.webp","wind/week_3/dawn/5.webp"],"why":"no bespoke line yet — served the condition bank","place":null,"pass1":"1 bank lines approved on this slot","seen":"Sunrise on a beachfront promenade. A woman running towards camera in a coral top, locs streaming sideways off her head, grinning. A wave has just exploded white against the sea wall behind her, a palm is bent hard over the pier, the promenade behind her is completely empty.","note":null,"lines":["That wave landed on the promenade about four seconds before she got there.","Sunday morning, and the sea is throwing the first half of it at her.","She will be tasting salt for the rest of the day and she knows it.","The palm is bent double and she is out here smiling about it.","T th is going past them at head height.","Monday, and the wind is the best thing that has happened to him so far."],"rescue":[null,null,null,null,null]},{"index":7,"image":"wind/week_1/dusk/3.webp","hash":"38635f77f610","condition":"wind","time":"dusk","week":"A","day":"sun","paths":["wind/week_1/dusk/3.webp","wind/week_3/dusk/3.webp"],"why":"no bespoke line yet — served the condition bank","place":null,"pass1":"3 bank lines approved on this slot","seen":"Table Mountain in silhouette across the bay in low gold light, seen from the beach. Sand streaking across the foreground in sheets. A couple in winter coats clinging to each other, laughing, unable to stand straight, her hair blown across her face and a scarf whipping between them. Surf behind, footprints in the sand.","note":null,"lines":["Sand in places sand should never be.","Table Mountain is right there and neither of them has looked at it once.","Neither of them can stand up straight and neither of them seems to mind.","The footprints behind them are already filling in and they only just walked there.","The beach itself is moving faster than they are, and in the same direction."],"rescue":["witty:wind#12",null,null,null,null]},{"index":8,"image":"wind/week_2/dawn/4.webp","hash":"c66c7fd4f50e","condition":"wind","time":"dawn","week":"A","day":"wed","paths":["wind/week_2/dawn/4.webp","wind/week_4/dawn/4.webp"],"why":"no bespoke line yet — served the condition bank","place":null,"pass1":"3 bank lines approved on this slot","seen":"A white Cape Dutch gabled farmhouse with dark shutters and a vine-covered stoep, lamps still on inside. A man in a dressing gown and shorts lunges barefoot across the lawn after a big black braai cover that is tumbling away from him; one slipper is lying on the grass behind him and a mug is standing on the step. Two white Adirondack chairs, a pine bent right over against a gold sunrise sky.","note":null,"lines":["He was going to have coffee. The mug is still standing on the step.","One slipper is already out of the game and the cover is still winning.","The braai cover is in the next suburb.","The pine behind him is bent right over, so this was never a fair contest.","Perfect conditions for losing your dignity."],"rescue":[null,null,"witty:wind#18",null,"witty:wind#8"]},{"index":9,"image":"wind/week_2/dawn/5.webp","hash":"3556004712b7","condition":"wind","time":"dawn","week":"A","day":"tue","paths":["wind/week_2/dawn/5.webp","wind/week_4/dawn/5.webp"],"why":"no bespoke line yet — served the condition bank","place":null,"pass1":"2 bank lines approved on this slot","seen":"A long line of gulls on a wide dawn beach, every one of them standing on the sand facing the same way with heads down, sand streaming past them in visible sheets. Surf and spray hazing the shoreline, mountains across the bay, pink sky. Not one bird is in the air.","note":null,"lines":["Even the seagulls are walking today.","Every one of them is pointing the same way and not one of them chose it.","Not one of them is flying, and that is the whole forecast right there.","The sand is going past them faster than the tide is coming in.","They will stand exactly like that until it drops, and it is not dropping."],"rescue":["witty:wind#9",null,null,null,null]},{"index":10,"image":"wind/week_2/day/1.webp","hash":"4d3a786acf48","condition":"wind","time":"day","week":"A","day":"tue","paths":["wind/week_2/day/1.webp"],"why":"no bespoke line yet — served the condition bank","place":null,"pass1":"3 bank lines approved on this slot","seen":"A woman standing in the middle of a tarred city road with Table Mountain large and clear behind her. Her hair is blown completely across her face, her floral skirt is lifted and she is holding it down with both hands, one flat shoe is coming off her heel, dry leaves are flying through the frame.","note":null,"lines":["Both hands are on the skirt, which means the hair is on its own.","Table Mountain is right behind her and she cannot see a single bit of it.","That shoe is coming off next and she has run out of hands.","The leaves going past her were still on a tree two streets ago.","Tuesday, and the wind has strong opinions about somebody else's outfit."],"rescue":[null,null,null,null,null]},{"index":11,"image":"wind/week_2/night/4.webp","hash":"eb7873fd7acb","condition":"wind","time":"night","week":"A","day":"mon","paths":["wind/week_2/night/4.webp","wind/week_4/night/4.webp"],"why":"no bespoke line yet — served the condition bank","place":null,"pass1":null,"seen":"A seafront boulevard at night under a full moon in torn cloud. A long row of tall palms with every frond streaming to one side, orange streetlights down the line, an empty wet road reflecting them, sea and distant town lights on the right, spray in the air.","note":null,"lines":["The moon is out and the palms have not stopped moving since sunset.","The moon is holding still and everything else up there is not.","Whatever is landing on that road is not rain, it is the sea arriving sideways.","The palms have been making that noise for hours and nobody is awake to mind.","The road is empty, every light is on, and the wind has the place to itself."],"rescue":[null,null,null,null,null]},{"index":12,"image":"wind/week_4/dawn/1.webp","hash":"f1a06c34c049","condition":"wind","time":"dawn","week":"A","day":"fri","paths":["wind/week_4/dawn/1.webp"],"why":"no bespoke line yet — served the condition bank","place":null,"pass1":"1 bank lines approved on this slot","seen":"A whitewashed West Coast cottage with green window frames at sunrise, sea just beyond a low stone wall. A woman reaches up to peg white sheets on a line; the sheets are blown straight out horizontal and the one on the end is lifting off. A galvanised tub of washing beside her, sandy yard, gulls in the air, sun low on the water.","note":null,"lines":["Those sheets will be dry before she has pegged the last one on the line.","There are more pegs on that line than the washing needs, and she knows why.","Everything on that line is going to smell like the sea by eight o'clock.","The one on the end has come loose and she has not spotted it yet.","Friday, and the wind is doing half of this job for her, free of charge."],"rescue":[null,null,null,null,null]}]};
const SRC_NAME = "review/set-001-lines-bespoke-wind.json";
const EXPORT_NAME = "set-001-lines-bespoke-wind-ruled.json";
// Namespaced per source. Round 1 and round 2 share this page's code, and with
// one key the round-2 page read round 1's saved text back out of storage and
// rendered it in every slot - Al opened it and saw the old lines. The stored
// value is keyed by image+index, and index 1 means a different line in each
// round, so the namespace is not optional.
const LS = 'pw_bespoke_lines_' + SRC_NAME.replace(/[^a-z0-9]+/gi, '_');
const state = JSON.parse(localStorage.getItem(LS) || '{}');
const $ = (id) => document.getElementById(id);
const key = (img, i) => img + '#' + i;
const wc = (s) => (s.trim() ? s.trim().split(/\s+/).length : 0);

function save() { localStorage.setItem(LS, JSON.stringify(state)); tally(); }

function tally() {
  let yes = 0, no = 0, mine = 0;
  for (const [k, v] of Object.entries(state)) {
    if (v.verdict === 'YES') yes += 1;
    if (v.verdict === 'NO') no += 1;
    if (k.endsWith('#5') && v.text && v.text.trim()) mine += 1;
  }
  const imagesWithAYes = new Set(Object.entries(state).filter(([, v]) => v.verdict === 'YES')
    .map(([k]) => k.split('#')[0])).size;
  $('tally').textContent = yes + ' ticked · ' + no + ' rejected · ' + mine + ' of your own · '
    + imagesWithAYes + '/' + DATA.images.length + ' images have at least one';
}

function render() {
  const m = $('main');
  m.innerHTML = '';
  for (const img of DATA.images) {
    const card = document.createElement('section');
    card.className = 'card';

    const hero = document.createElement('div');
    hero.className = 'hero';
    hero.style.width = DATA.box.w + 'px';
    hero.style.height = DATA.box.h + 'px';
    hero.style.backgroundImage = 'url("/assets/images/bg/' + img.image + '")';
    hero.style.backgroundPosition = 'center 50%';
    const cap = document.createElement('p');
    cap.className = 'cap';
    cap.style.padding = DATA.cap.runway.toFixed(1) + 'px 16px ' + DATA.cap.padBottom.toFixed(1) + 'px';
    cap.style.fontSize = DATA.cap.font.toFixed(1) + 'px';
    cap.style.background = 'linear-gradient(to top, rgba(0,0,0,.80) 0%, rgba(0,0,0,.62) calc(100% - '
      + DATA.cap.runway.toFixed(1) + 'px), rgba(0,0,0,0) 100%)';
    cap.style.borderRadius = '0 0 20px 20px';
    cap.textContent = img.lines[0];
    hero.appendChild(cap);
    card.appendChild(hero);

    const right = document.createElement('div');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = '<b>' + img.index + '. ' + img.condition + ' · ' + img.time + '</b> · ' + img.image
      + ' · ' + img.week + '/' + img.day + ' · ' + img.why + (img.pass1 ? ' · pass-1 ' + img.pass1 : '');
    right.appendChild(meta);

    const seen = document.createElement('p');
    seen.className = 'seen';
    seen.textContent = img.seen;
    right.appendChild(seen);

    if (img.note) {
      const n = document.createElement('p');
      n.className = 'note';
      n.textContent = img.note;
      right.appendChild(n);
    }

    // Lines already kept for this picture, locked and not re-litigated — the
    // point of round 2 is the gaps, and showing the survivors is what makes a
    // new line judgeable as part of a SET rather than on its own.
    if (img.alreadyKept && img.alreadyKept.length) {
      const box = document.createElement('div');
      box.className = 'meta';
      box.style.margin = '2px 0 10px';
      box.textContent = 'already kept (' + img.alreadyKept.length + '): ';
      for (const t of img.alreadyKept) {
        const b = document.createElement('div');
        b.style.cssText = 'color:#63c98a;font-size:12.5px;margin:2px 0 0 12px';
        b.textContent = '✓ ' + t;
        box.appendChild(b);
      }
      right.appendChild(box);
    }

    // The written candidates plus one empty slot for Al's own.
    const N = img.lines.length;
    for (let i = 0; i < N + 1; i += 1) {
      const k = key(img.image, i);
      const rec = state[k] || {};
      const wrap = document.createElement('div');
      wrap.className = 'line' + (i === N ? ' mine' : '');

      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = i === N ? '+' : String(i + 1);
      wrap.appendChild(n);

      const ref = img.rescue && img.rescue[i];
      if (ref) {
        const tag = document.createElement('span');
        tag.className = 'resc';
        tag.textContent = 'bank';
        tag.title = 'Rescued from the existing bank (' + ref + ') rather than newly written';
        wrap.appendChild(tag);
      }

      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = rec.text != null ? rec.text : (i < N ? img.lines[i] : '');
      if (i === N) inp.placeholder = 'your own line for this picture…';
      const count = document.createElement('span');
      count.className = 'wc';
      const paint = () => {
        cap.textContent = inp.value || img.lines[0];
        count.textContent = wc(inp.value) + 'w';
      };
      inp.addEventListener('focus', paint);
      inp.addEventListener('input', () => {
        state[k] = Object.assign({}, state[k], { text: inp.value });
        paint(); save();
      });
      wrap.appendChild(inp);
      count.textContent = wc(inp.value) + 'w';
      wrap.appendChild(count);

      const yes = document.createElement('button');
      yes.className = 'y' + (rec.verdict === 'YES' ? ' on' : '');
      yes.textContent = '✓';
      yes.title = 'keep this line for this picture';
      yes.onclick = () => {
        state[k] = Object.assign({}, state[k], { text: inp.value, verdict: rec.verdict === 'YES' ? null : 'YES' });
        save(); render();
      };
      const no = document.createElement('button');
      no.className = 'n2' + (rec.verdict === 'NO' ? ' on' : '');
      no.textContent = '✕';
      no.title = 'not for this picture';
      no.onclick = () => {
        state[k] = Object.assign({}, state[k], { text: inp.value, verdict: rec.verdict === 'NO' ? null : 'NO' });
        save(); render();
      };
      wrap.appendChild(yes);
      wrap.appendChild(no);
      right.appendChild(wrap);
    }

    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = 'Click into a line to see it on the picture. Edit the text freely — the edit is what exports. '
      + 'The dashed slot is yours.';
    right.appendChild(hint);
    card.appendChild(right);
    m.appendChild(card);
  }
  tally();
}

$('export').onclick = () => {
  const out = { generated: '2026-08-19', ruledBy: 'Al, bespoke line review', bucket: DATA.bucket || null, images: [] };
  for (const img of DATA.images) {
    const kept = []; const rejected = [];
    // Lines already kept in an earlier round ride along in the export, marked as
    // such: the file is the picture's whole approved set, not just this round's
    // additions, so nothing downstream has to join two exports to know the truth.
    for (const t of (img.alreadyKept || [])) kept.push({ text: t, source: 'bespoke', round: 1, edited: false });
    const N = img.lines.length;
    for (let i = 0; i < N + 1; i += 1) {
      const rec = state[key(img.image, i)] || {};
      const text = rec.text != null ? rec.text : (i < N ? img.lines[i] : '');
      if (!text || !text.trim()) continue;
      const entry = { text: text.trim(), source: i === N ? 'al' : 'bespoke',
        round: 2, edited: i < N && text.trim() !== img.lines[i] };
      const ref = img.rescue && img.rescue[i];
      if (ref && !entry.edited) { entry.source = 'bank'; entry.rescue = ref; }
      if (rec.verdict === 'YES') kept.push(entry);
      else if (rec.verdict === 'NO') rejected.push(entry);
    }
    out.images.push({ image: img.image, hash: img.hash, condition: img.condition, time: img.time,
      week: img.week, day: img.day, paths: img.paths, kept, rejected });
  }
  out.keptCount = out.images.reduce((n, i) => n + i.kept.length, 0);
  out.imagesWithNone = out.images.filter((i) => !i.kept.length).map((i) => i.image);
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = EXPORT_NAME;
  a.click();
};

render();
</script>
