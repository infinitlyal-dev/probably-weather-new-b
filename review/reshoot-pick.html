<!doctype html>
<meta charset="utf-8">
<title>PW — pick the replacements</title>
<link rel="stylesheet" href="../assets/type-prototype-caption.css">
<style>
  :root { --bg:#14110d; --panel:#1f1a14; --ink:#fffaf3; --ink2:#b5ab9d; --gold:#ffd700; --keep:#63c98a; --cut:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:10; background:rgba(20,17,13,.97); border-bottom:1px solid rgba(246,242,232,.14);
           padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0 8px 0 0; }
  button { font:inherit; border:1px solid rgba(246,242,232,.18); background:var(--panel); color:var(--ink);
           border-radius:8px; padding:7px 12px; cursor:pointer; }
  button:hover { border-color:var(--gold); }
  button.primary { background:var(--gold); color:#1a1a2e; border-color:var(--gold); font-weight:700; }
  .tally { color:var(--ink2); font-variant-numeric:tabular-nums; }
  main { padding:18px; display:flex; flex-direction:column; gap:26px; }
  .slot { border-top:1px solid rgba(246,242,232,.12); padding-top:16px; }
  .head { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; margin-bottom:10px; }
  .head b { font-size:15px; }
  .head span { color:var(--ink2); font-size:12.5px; }
  .frames { display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
  figure { margin:0; }
  .hero { position:relative; overflow:hidden; background-size:cover; background-position:center 50%; background-repeat:no-repeat;
          border-radius:0 0 20px 20px; box-shadow:0 18px 44px rgba(0,0,0,.55); }
  .hero.old { filter:grayscale(.35) brightness(.7); }
  .cap { position:absolute; left:0; right:0; bottom:0; margin:0; color:#fff; font-weight:700;
         font-family:'Caveat Prototype','Segoe Print','Bradley Hand',cursive; text-align:left; line-height:1.08;
         text-shadow:0 2px 14px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.8); }
  figcaption { text-align:center; margin-top:8px; font-size:12px; color:var(--ink2); }
  .pick { margin-top:6px; }
  .pick.on { border-color:var(--keep); color:var(--keep); font-weight:700; }
  .rej.on { border-color:var(--cut); color:var(--cut); font-weight:700; }
  .verdict { margin-left:auto; font-size:12.5px; }
</style>

<header>
  <h1>Pick the replacements — 15 slots, two candidates each</h1>
  <span class="tally" id="tally"></span>
  <span style="flex:1"></span>
  <button id="export" class="primary">Export picks</button>
</header>
<main id="main"></main>

<script>
const DATA = {"box":{"w":327,"h":518},"cap":{"runway":56.84,"font":33.00000000000001,"padBottom":14.616000000000001},"slots":[{"slot":"storm/week_1/night/4.webp","bucket":"storm-night","place":"Johannesburg northern suburbs","idx":[1,2],"condition":"storm","time":"night","paths":["storm/week_1/night/4.webp","storm/week_3/night/4.webp"],"line":"Wait it out indoors. The mountains aren't going anywhere.","a":"/output/reshoot-2026-08-18/01.png","b":"/output/reshoot-2026-08-18/02.png","old":"/assets/images/bg/storm/week_1/night/4.webp"},{"slot":"storm/week_1/night/5.webp","bucket":"storm-night","place":"Pretoria east","idx":[3,4],"condition":"storm","time":"night","paths":["storm/week_1/night/5.webp","storm/week_3/night/5.webp"],"line":"Wait it out indoors. The mountains aren't going anywhere.","a":"/output/reshoot-2026-08-18/03.png","b":"/output/reshoot-2026-08-18/04.png","old":"/assets/images/bg/storm/week_1/night/5.webp"},{"slot":"storm/week_2/night/3.webp","bucket":"storm-night","place":"Durban","idx":[5,6],"condition":"storm","time":"night","paths":["storm/week_2/night/3.webp","storm/week_4/night/3.webp"],"line":"Wait it out indoors. The mountains aren't going anywhere.","a":"/output/reshoot-2026-08-18/05.png","b":"/output/reshoot-2026-08-18/06.png","old":"/assets/images/bg/storm/week_2/night/3.webp"},{"slot":"storm/week_2/night/4.webp","bucket":"storm-night","place":"Bloemfontein","idx":[7,8],"condition":"storm","time":"night","paths":["storm/week_2/night/4.webp","storm/week_4/night/4.webp"],"line":"Wait it out indoors. The mountains aren't going anywhere.","a":"/output/reshoot-2026-08-18/07.png","b":"/output/reshoot-2026-08-18/08.png","old":"/assets/images/bg/storm/week_2/night/4.webp"},{"slot":"wind/week_1/night/1.webp","bucket":"wind-night","place":"Gqeberha","idx":[9,10],"condition":"wind","time":"night","paths":["wind/week_1/night/1.webp","wind/week_3/night/1.webp"],"line":"The wind swept the clouds away so you could see the stars. Apologies about everything else.","a":"/output/reshoot-2026-08-18/09.png","b":"/output/reshoot-2026-08-18/10.png","old":"/assets/images/bg/wind/week_1/night/1.webp"},{"slot":"wind/week_1/night/3.webp","bucket":"wind-night","place":"Table View","idx":[11,12],"condition":"wind","time":"night","paths":["wind/week_1/night/3.webp","wind/week_3/night/3.webp"],"line":"The wind swept the clouds away so you could see the stars. Apologies about everything else.","a":"/output/reshoot-2026-08-18/11.png","b":"/output/reshoot-2026-08-18/12.png","old":"/assets/images/bg/wind/week_1/night/3.webp"},{"slot":"wind/week_2/night/3.webp","bucket":"wind-night","place":"Kimberley","idx":[13,14],"condition":"wind","time":"night","paths":["wind/week_2/night/3.webp","wind/week_4/night/3.webp"],"line":"The wind swept the clouds away so you could see the stars. Apologies about everything else.","a":"/output/reshoot-2026-08-18/13.png","b":"/output/reshoot-2026-08-18/14.png","old":"/assets/images/bg/wind/week_2/night/3.webp"},{"slot":"wind/week_2/night/7.webp","bucket":"wind-night","place":"Durban beachfront","idx":[15,16],"condition":"wind","time":"night","paths":["wind/week_2/night/7.webp","wind/week_4/night/7.webp"],"line":"The wind swept the clouds away so you could see the stars. Apologies about everything else.","a":"/output/reshoot-2026-08-18/15.png","b":"/output/reshoot-2026-08-18/16.png","old":"/assets/images/bg/wind/week_2/night/7.webp"},{"slot":"rain/week_1/night/2.webp","bucket":"rain-night","place":"Durban","idx":[17,18],"condition":"rain","time":"night","paths":["rain/week_1/night/2.webp","rain/week_3/night/2.webp"],"line":"The Boland is getting watered in its sleep and will absolutely brag about it tomorrow.","a":"/output/reshoot-2026-08-18/17.png","b":"/output/reshoot-2026-08-18/18.png","old":"/assets/images/bg/rain/week_1/night/2.webp"},{"slot":"rain/week_1/night/4.webp","bucket":"rain-night","place":"Johannesburg","idx":[19,20],"condition":"rain","time":"night","paths":["rain/week_1/night/4.webp","rain/week_3/night/4.webp"],"line":"The Boland is getting watered in its sleep and will absolutely brag about it tomorrow.","a":"/output/reshoot-2026-08-18/19.png","b":"/output/reshoot-2026-08-18/20.png","old":"/assets/images/bg/rain/week_1/night/4.webp"},{"slot":"wind/week_1/day/2.webp","bucket":"wind-day","place":"Somerset West","idx":[21,22],"condition":"wind","time":"day","paths":["wind/week_1/day/2.webp"],"line":"The wind swept the clouds away so you could see the stars. Apologies about everything else.","a":"/output/reshoot-2026-08-18/21.png","b":"/output/reshoot-2026-08-18/22.png","old":"/assets/images/bg/wind/week_1/day/2.webp"},{"slot":"wind/week_2/day/6.webp","bucket":"wind-day","place":"Gqeberha","idx":[23,24],"paths":["wind/week_2/day/6.webp"],"line":"Probably weather.","a":"/output/reshoot-2026-08-18/23.png","b":"/output/reshoot-2026-08-18/24.png","old":"/assets/images/bg/wind/week_2/day/6.webp"},{"slot":"wind/week_4/day/2.webp","bucket":"wind-day","place":"Johannesburg","idx":[25,26],"condition":"wind","time":"day","paths":["wind/week_4/day/2.webp"],"line":"The wind swept the clouds away so you could see the stars. Apologies about everything else.","a":"/output/reshoot-2026-08-18/25.png","b":"/output/reshoot-2026-08-18/26.png","old":"/assets/images/bg/wind/week_4/day/2.webp"},{"slot":"wind/week_4/day/6.webp","bucket":"wind-day","place":"Durban","idx":[27,28],"condition":"wind","time":"day","paths":["wind/week_4/day/6.webp"],"line":"The wind swept the clouds away so you could see the stars. Apologies about everything else.","a":"/output/reshoot-2026-08-18/27.png","b":"/output/reshoot-2026-08-18/28.png","old":"/assets/images/bg/wind/week_4/day/6.webp"},{"slot":"wind/week_2/dusk/6.webp","bucket":"wind-dusk","place":"Langebaan","idx":[29,30],"condition":"wind","time":"dusk","paths":["wind/week_2/dusk/6.webp","wind/week_4/dusk/6.webp"],"line":"The wind swept the clouds away so you could see the stars. Apologies about everything else.","a":"/output/reshoot-2026-08-18/29.png","b":"/output/reshoot-2026-08-18/30.png","old":"/assets/images/bg/wind/week_2/dusk/6.webp"}]};
const LS = 'pw_reshoot_picks_v1';
// Al's picks from the first pass are seeded in, so a re-look opens on his
// existing choices. He judged those with a defective caption (the slot/cut-list
// join failed on a missing .webp, so every frame carried the fallback line and
// the old frame 404'd) — the picks are worth keeping, the second look is worth
// having.
const SEED = {"storm/week_1/night/4.webp":"B","storm/week_1/night/5.webp":"A","storm/week_2/night/3.webp":"B","storm/week_2/night/4.webp":"B","wind/week_1/night/1.webp":"B","wind/week_1/night/3.webp":"A","wind/week_2/night/3.webp":"A","wind/week_2/night/7.webp":"B","rain/week_1/night/2.webp":"B","rain/week_1/night/4.webp":"A","wind/week_1/day/2.webp":"B","wind/week_2/day/6.webp":"A","wind/week_4/day/2.webp":"A","wind/week_4/day/6.webp":"A","wind/week_2/dusk/6.webp":"A"};
const state = Object.assign({}, SEED, JSON.parse(localStorage.getItem(LS) || '{}'));
const $ = (id) => document.getElementById(id);

function scrim(runway) {
  return 'linear-gradient(to top, rgba(0,0,0,.80) 0%, rgba(0,0,0,.62) calc(100% - ' + runway.toFixed(1) + 'px), rgba(0,0,0,0) 100%)';
}

function frame(src, line, extraClass) {
  const d = document.createElement('div');
  d.className = 'hero ' + (extraClass || '');
  d.style.width = DATA.box.w + 'px';
  d.style.height = DATA.box.h + 'px';
  d.style.backgroundImage = 'url("' + src + '")';
  const cap = document.createElement('p');
  cap.className = 'cap';
  cap.textContent = line;
  cap.style.padding = DATA.cap.runway.toFixed(1) + 'px 16px ' + DATA.cap.padBottom.toFixed(1) + 'px';
  cap.style.fontSize = DATA.cap.font.toFixed(1) + 'px';
  cap.style.background = scrim(DATA.cap.runway);
  cap.style.borderRadius = '0 0 20px 20px';
  d.appendChild(cap);
  return d;
}

function render() {
  const m = $('main');
  m.innerHTML = '';
  DATA.slots.forEach((s) => {
    const sec = document.createElement('section');
    sec.className = 'slot';
    const head = document.createElement('div');
    head.className = 'head';
    const b = document.createElement('b'); b.textContent = s.bucket + ' · ' + s.place;
    const sp = document.createElement('span');
    sp.textContent = s.slot + ' · ' + s.paths.length + ' rotation slot(s)';
    const v = document.createElement('span'); v.className = 'verdict';
    v.textContent = state[s.slot] ? 'chosen: ' + state[s.slot] : 'undecided';
    head.append(b, sp, v);
    sec.appendChild(head);

    const row = document.createElement('div');
    row.className = 'frames';
    for (const which of ['a', 'b']) {
      const fig = document.createElement('figure');
      fig.appendChild(frame(s[which], s.line));
      const cap = document.createElement('figcaption');
      cap.textContent = which.toUpperCase();
      const btn = document.createElement('button');
      btn.className = 'pick' + (state[s.slot] === which.toUpperCase() ? ' on' : '');
      btn.textContent = 'Pick ' + which.toUpperCase();
      btn.onclick = () => { state[s.slot] = which.toUpperCase(); save(); };
      cap.appendChild(document.createElement('br'));
      cap.appendChild(btn);
      fig.appendChild(cap);
      row.appendChild(fig);
    }
    // The frame being replaced, dimmed, so the comparison is against what is
    // actually live rather than against a memory of it.
    const figOld = document.createElement('figure');
    figOld.appendChild(frame(s.old, s.line, 'old'));
    const capOld = document.createElement('figcaption');
    capOld.textContent = 'the cut one';
    const rej = document.createElement('button');
    rej.className = 'rej' + (state[s.slot] === 'NEITHER' ? ' on' : '');
    rej.textContent = 'Reject both';
    rej.onclick = () => { state[s.slot] = 'NEITHER'; save(); };
    capOld.appendChild(document.createElement('br'));
    capOld.appendChild(rej);
    figOld.appendChild(capOld);
    row.appendChild(figOld);

    sec.appendChild(row);
    m.appendChild(sec);
  });
  const done = DATA.slots.filter((s) => state[s.slot]).length;
  const nei = DATA.slots.filter((s) => state[s.slot] === 'NEITHER').length;
  $('tally').textContent = done + ' / ' + DATA.slots.length + ' decided · ' + nei + ' need another go';
}

function save() { localStorage.setItem(LS, JSON.stringify(state)); render(); }

$('export').onclick = () => {
  const out = { generated: '2026-08-18', ruledBy: 'Al, reshoot pick tool', picks: [], redo: [] };
  for (const s of DATA.slots) {
    const v = state[s.slot];
    if (!v) continue;
    if (v === 'NEITHER') { out.redo.push({ slot: s.slot, bucket: s.bucket, place: s.place }); continue; }
    out.picks.push({ slot: s.slot, bucket: s.bucket, place: s.place, paths: s.paths,
      candidate: v, file: v === 'A' ? s.a : s.b });
  }
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'reshoot-picks.json';
  a.click();
};

render();
</script>
