const SRC_NAME = "review/set-001-lines-bespoke-cold.json";
const EXPORT_NAME = "set-001-lines-bespoke-cold-ruled.json";
// Namespaced per source. Round 1 and round 2 share this page's code, and with
// one key the round-2 page read round 1's saved text back out of storage and
// rendered it in every slot - Al opened it and saw the old lines. The stored
// value is keyed by image+index, and index 1 means a different line in each
// round, so the namespace is not optional.
const LS = 'pw_bespoke_lines_' + SRC_NAME.replace(/[^a-z0-9]+/gi, '_');
const state = JSON.parse(localStorage.getItem(LS) || '{}');
const $ = (id) => document.getElementById(id);
const key = (img, i) => img + '#' + i;
const wc = (s) => (s.trim() ? s.trim().split(/\s+/).length : 0);

function save() { localStorage.setItem(LS, JSON.stringify(state)); tally(); }

function tally() {
  let yes = 0, no = 0, mine = 0;
  for (const [k, v] of Object.entries(state)) {
    if (v.verdict === 'YES') yes += 1;
    if (v.verdict === 'NO') no += 1;
    if (k.endsWith('#5') && v.text && v.text.trim()) mine += 1;
  }
  const imagesWithAYes = new Set(Object.entries(state).filter(([, v]) => v.verdict === 'YES')
    .map(([k]) => k.split('#')[0])).size;
  $('tally').textContent = yes + ' ticked · ' + no + ' rejected · ' + mine + ' of your own · '
    + imagesWithAYes + '/' + DATA.images.length + ' images have at least one';
}

function render() {
  const m = $('main');
  m.innerHTML = '';
  for (const img of DATA.images) {
    const card = document.createElement('section');
    card.className = 'card';

    const hero = document.createElement('div');
    hero.className = 'hero';
    hero.style.width = DATA.box.w + 'px';
    hero.style.height = DATA.box.h + 'px';
    hero.style.backgroundImage = 'url("/assets/images/bg/' + img.image + '")';
    hero.style.backgroundPosition = 'center 50%';
    const cap = document.createElement('p');
    cap.className = 'cap';
    cap.style.padding = DATA.cap.runway.toFixed(1) + 'px 16px ' + DATA.cap.padBottom.toFixed(1) + 'px';
    cap.style.fontSize = DATA.cap.font.toFixed(1) + 'px';
    cap.style.background = 'linear-gradient(to top, rgba(0,0,0,.80) 0%, rgba(0,0,0,.62) calc(100% - '
      + DATA.cap.runway.toFixed(1) + 'px), rgba(0,0,0,0) 100%)';
    cap.style.borderRadius = '0 0 20px 20px';
    cap.textContent = img.lines[0];
    hero.appendChild(cap);
    card.appendChild(hero);

    const right = document.createElement('div');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = '<b>' + img.index + '. ' + img.condition + ' · ' + img.time + '</b> · ' + img.image
      + ' · ' + img.week + '/' + img.day + ' · ' + img.why + (img.pass1 ? ' · pass-1 ' + img.pass1 : '');
    right.appendChild(meta);

    const seen = document.createElement('p');
    seen.className = 'seen';
    seen.textContent = img.seen;
    right.appendChild(seen);

    if (img.note) {
      const n = document.createElement('p');
      n.className = 'note';
      n.textContent = img.note;
      right.appendChild(n);
    }

    // Lines already kept for this picture, locked and not re-litigated — the
    // point of round 2 is the gaps, and showing the survivors is what makes a
    // new line judgeable as part of a SET rather than on its own.
    if (img.alreadyKept && img.alreadyKept.length) {
      const box = document.createElement('div');
      box.className = 'meta';
      box.style.margin = '2px 0 10px';
      box.textContent = 'already kept (' + img.alreadyKept.length + '): ';
      for (const t of img.alreadyKept) {
        const b = document.createElement('div');
        b.style.cssText = 'color:#63c98a;font-size:12.5px;margin:2px 0 0 12px';
        b.textContent = '✓ ' + t;
        box.appendChild(b);
      }
      right.appendChild(box);
    }

    // The written candidates plus one empty slot for Al's own.
    const N = img.lines.length;
    for (let i = 0; i < N + 1; i += 1) {
      const k = key(img.image, i);
      const rec = state[k] || {};
      const wrap = document.createElement('div');
      wrap.className = 'line' + (i === N ? ' mine' : '');

      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = i === N ? '+' : String(i + 1);
      wrap.appendChild(n);

      const ref = img.rescue && img.rescue[i];
      if (ref) {
        const tag = document.createElement('span');
        tag.className = 'resc';
        tag.textContent = 'bank';
        tag.title = 'Rescued from the existing bank (' + ref + ') rather than newly written';
        wrap.appendChild(tag);
      }

      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = rec.text != null ? rec.text : (i < N ? img.lines[i] : '');
      if (i === N) inp.placeholder = 'your own line for this picture…';
      const count = document.createElement('span');
      count.className = 'wc';
      const paint = () => {
        cap.textContent = inp.value || img.lines[0];
        count.textContent = wc(inp.value) + 'w';
      };
      inp.addEventListener('focus', paint);
      inp.addEventListener('input', () => {
        state[k] = Object.assign({}, state[k], { text: inp.value });
        paint(); save();
      });
      wrap.appendChild(inp);
      count.textContent = wc(inp.value) + 'w';
      wrap.appendChild(count);

      const yes = document.createElement('button');
      yes.className = 'y' + (rec.verdict === 'YES' ? ' on' : '');
      yes.textContent = '✓';
      yes.title = 'keep this line for this picture';
      yes.onclick = () => {
        state[k] = Object.assign({}, state[k], { text: inp.value, verdict: rec.verdict === 'YES' ? null : 'YES' });
        save(); render();
      };
      const no = document.createElement('button');
      no.className = 'n2' + (rec.verdict === 'NO' ? ' on' : '');
      no.textContent = '✕';
      no.title = 'not for this picture';
      no.onclick = () => {
        state[k] = Object.assign({}, state[k], { text: inp.value, verdict: rec.verdict === 'NO' ? null : 'NO' });
        save(); render();
      };
      wrap.appendChild(yes);
      wrap.appendChild(no);
      right.appendChild(wrap);
    }

    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = 'Click into a line to see it on the picture. Edit the text freely — the edit is what exports. '
      + 'The dashed slot is yours.';
    right.appendChild(hint);
    card.appendChild(right);
    m.appendChild(card);
  }
  tally();
}

$('export').onclick = () => {
  const out = { generated: '2026-08-19', ruledBy: 'Al, bespoke line review', bucket: DATA.bucket || null, images: [] };
  for (const img of DATA.images) {
    const kept = []; const rejected = [];
    // Lines already kept in an earlier round ride along in the export, marked as
    // such: the file is the picture's whole approved set, not just this round's
    // additions, so nothing downstream has to join two exports to know the truth.
    for (const t of (img.alreadyKept || [])) kept.push({ text: t, source: 'bespoke', round: 1, edited: false });
    const N = img.lines.length;
    for (let i = 0; i < N + 1; i += 1) {
      const rec = state[key(img.image, i)] || {};
      const text = rec.text != null ? rec.text : (i < N ? img.lines[i] : '');
      if (!text || !text.trim()) continue;
      const entry = { text: text.trim(), source: i === N ? 'al' : 'bespoke',
        round: 2, edited: i < N && text.trim() !== img.lines[i] };
      const ref = img.rescue && img.rescue[i];
      if (ref && !entry.edited) { entry.source = 'bank'; entry.rescue = ref; }
      if (rec.verdict === 'YES') kept.push(entry);
      else if (rec.verdict === 'NO') rejected.push(entry);
    }
    out.images.push({ image: img.image, hash: img.hash, condition: img.condition, time: img.time,
      week: img.week, day: img.day, paths: img.paths, kept, rejected });
  }
  out.keptCount = out.images.reduce((n, i) => n + i.kept.length, 0);
  out.imagesWithNone = out.images.filter((i) => !i.kept.length).map((i) => i.image);
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = EXPORT_NAME;
  a.click();
};

render();
</script>
