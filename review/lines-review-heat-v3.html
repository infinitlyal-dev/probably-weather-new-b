<style>
  :root { --bg:#14110d; --panel:#1f1a14; --ink:#fffaf3; --ink2:#b5ab9d; --gold:#ffd700; --yes:#63c98a; --no:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:10; background:rgba(20,17,13,.97); border-bottom:1px solid rgba(246,242,232,.14);
           padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0 8px 0 0; }
  button { font:inherit; border:1px solid rgba(246,242,232,.18); background:var(--panel); color:var(--ink);
           border-radius:8px; padding:6px 11px; cursor:pointer; }
  button:hover { border-color:var(--gold); }
  button.primary { background:var(--gold); color:#1a1a2e; border-color:var(--gold); font-weight:700; }
  .tally { color:var(--ink2); font-variant-numeric:tabular-nums; }
  main { padding:18px; display:flex; flex-direction:column; gap:30px; }
  .card { display:grid; grid-template-columns:auto 1fr; gap:22px; border-top:1px solid rgba(246,242,232,.12); padding-top:18px; }
  .hero { position:relative; overflow:hidden; background-size:cover; background-repeat:no-repeat;
          border-radius:0 0 20px 20px; box-shadow:0 18px 44px rgba(0,0,0,.55); }
  .cap { position:absolute; left:0; right:0; bottom:0; margin:0; color:#fff; font-weight:700;
         font-family:'Caveat Prototype','Segoe Print','Bradley Hand',cursive; text-align:left; line-height:1.08;
         text-shadow:0 2px 14px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.8); }
  .meta { color:var(--ink2); font-size:12.5px; margin-bottom:10px; }
  .meta b { color:var(--ink); }
  .seen { color:var(--ink2); font-size:12.5px; max-width:80ch; margin:0 0 12px; font-style:italic; }
  .note { color:#ffb84d; font-size:12.5px; max-width:80ch; margin:0 0 12px; }
  .line { display:flex; gap:8px; align-items:flex-start; margin-bottom:7px; }
  .line input[type=text] { flex:1; min-width:0; font:inherit; background:#181410; color:var(--ink);
      border:1px solid rgba(246,242,232,.16); border-radius:7px; padding:7px 10px; }
  .line input[type=text]:focus { outline:none; border-color:var(--gold); }
  .line .n { width:18px; color:var(--ink2); font-variant-numeric:tabular-nums; padding-top:8px; }
  .line .wc { width:58px; color:var(--ink2); font-size:11.5px; padding-top:9px; text-align:right; }
  .y.on { border-color:var(--yes); color:var(--yes); font-weight:700; }
  .n2.on { border-color:var(--no); color:var(--no); font-weight:700; }
  .line.mine input[type=text] { border-style:dashed; }
  .line .resc { flex:none; align-self:flex-start; margin-top:8px; font-size:10.5px; letter-spacing:.06em;
      text-transform:uppercase; color:#8fb7ff; border:1px solid #8fb7ff55; border-radius:5px; padding:1px 5px; }
  .hint { color:var(--ink2); font-size:12px; margin:10px 0 0; max-width:80ch; }
</style>

<header>
  <h1>Bespoke lines — heat, 12 photographs, three per image incl. locked keeps</h1>
  <span class="tally" id="tally"></span>
  <span style="flex:1"></span>
  <button id="export" class="primary">Export</button>
</header>
<main id="main"></main>

and the road ahead agrees in shimmer.","That sky is not white, it is just too hot to be blue.","Every kilometre of that road is being served with a heat shimmer today."],"rescue":[null,null,null],"alreadyKept":[]},{"index":4,"image":"heat/week_4/day/7.webp","hash":"0cc1648cbc13","condition":"heat","time":"day","week":"A","day":"sun","paths":["heat/week_4/day/7.webp"],"why":"round-1 lines retired by the doctrine redo","place":null,"pass1":null,"seen":"Five kids charging through an oscillating sprinkler on a green lawn in hard sun, parents watching from the shaded patio. Sunday.","note":null,"lines":["The sprinkler is doing lawn duty and lifeguard duty at the same time.","On days like this the garden hose outranks every toy in the house.","Lawn watered, kids cooled, parents left in peace: the heat sorted everything."],"rescue":[null,null,null],"alreadyKept":[]},{"index":5,"image":"heat/week_1/dusk/6.webp","hash":"9728bed72ec6","condition":"heat","time":"dusk","week":"A","day":"sun","paths":["heat/week_1/dusk/6.webp","heat/week_3/dusk/6.webp"],"why":"round-1 lines retired by the doctrine redo","place":null,"pass1":null,"seen":"A woman with a glass of white wine on the stone stoep steps of a Karoo farmhouse at a blazing orange sunset, windpomp silhouetted on the plain. Sunday.","note":null,"lines":["The day finally dropped below thirty and the stoep is collecting the reward.","A sky like that is what forty degrees looks like on its way out.","First sittable hour since breakfast, and it brought colours."],"rescue":[null,null,null],"alreadyKept":[]},{"index":6,"image":"heat/week_2/dusk/1.webp","hash":"93f4a43551af","condition":"heat","time":"dusk","week":"A","day":"fri","paths":["heat/week_2/dusk/1.webp","heat/week_4/dusk/1.webp"],"why":"round-1 lines retired by the doctrine redo","place":null,"pass1":null,"seen":"Three friends walking the palm-lined beachfront promenade at sunset, soft-serve cones already melting over their hands. Friday.","note":null,"lines":["The soft-serve is losing a race it was never going to win.","The promenade fills up the minute the temperature becomes friendly again.","Still warm enough at sunset that the ice cream is doing the sweating."],"rescue":[null,null,null],"alreadyKept":[]},{"index":7,"image":"heat/week_1/night/1.webp","hash":"ea333aeefd0d","condition":"heat","time":"night","week":"A","day":"sun","paths":["heat/week_1/night/1.webp","heat/week_3/night/1.webp"],"why":"round-1 lines retired by the doctrine redo","place":null,"pass1":null,"seen":"A sweating glass of ice water standing on the promenade wall at night, bicycles leaning on the rail, a family strolling under the streetlights. Sunday.","note":null,"lines":["The glass is sweating at nine at night, which tells you about today.","The whole promenade came out after dark, when the town becomes walkable again.","Night has not cooled anything yet; even the water is perspiring."],"rescue":[null,null,null],"alreadyKept":[]},{"index":8,"image":"heat/week_1/night/2.webp","hash":"73f8b2781c4c","condition":"heat","time":"night","week":"A","day":"fri","paths":["heat/week_1/night/2.webp","heat/week_3/night/2.webp"],"why":"round-1 lines retired by the doctrine redo","place":null,"pass1":null,"seen":"A family asleep on mattresses laid out on the stoep under a huge Milky Way, one boy still awake watching a bat cross the stars. Friday.","note":null,"lines":["Too hot for walls tonight: the whole family moved the bedroom outside.","The house held the day's heat, so the beds came out to the stars.","One member of the sleep-out is doing exactly none of the sleeping."],"rescue":[null,null,null],"alreadyKept":[]},{"index":9,"image":"heat/week_1/night/3.webp","hash":"706cd1220e10","condition":"heat","time":"night","week":"A","day":"thu","paths":["heat/week_1/night/3.webp","heat/week_3/night/3.webp"],"why":"round-1 lines retired by the doctrine redo","place":null,"pass1":null,"seen":"A warm-night balcony — sweating jug of ice water and two glasses on the table, woven hand fan on the chair, sheer curtain billowing, palms beyond the rail. Thursday.","note":null,"lines":["The curtain is moving, which is the first good news since this morning.","Ice in the jug, fan on the chair: the night shift of a forty-degree day.","The first breeze in twelve hours just walked in without knocking."],"rescue":[null,null,null],"alreadyKept":[]},{"index":10,"image":"heat/week_1/night/4.webp","hash":"f2e76528eca3","condition":"heat","time":"night","week":"A","day":"mon","paths":["heat/week_1/night/4.webp","heat/week_3/night/4.webp"],"why":"round-1 lines retired by the doctrine redo","place":null,"pass1":null,"seen":"A pedestal fan running beside the bed at 2:00 AM, someone asleep under a mosquito net, glass of water on the nightstand. Monday.","note":null,"lines":["Two in the morning and the fan is the hardest worker in the house.","The fan is on its third shift and the night is still not cooling.","The glass on the nightstand went warm an hour ago; the fan carries on alone."],"rescue":[null,null,null],"alreadyKept":[]},{"index":11,"image":"heat/week_2/night/2.webp","hash":"87546db18e01","condition":"heat","time":"night","week":"A","day":"sat","paths":["heat/week_2/night/2.webp","heat/week_4/night/2.webp"],"why":"round-1 lines retired by the doctrine redo","place":null,"pass1":null,"seen":"Friends in the pool at night with drinks under string lights, one more watching from the deck, the house glowing warm behind. Saturday.","note":null,"lines":["Still thirty degrees after dark, so the party moved into the water.","Night swimming is not a plan; it is what this weather leaves you.","The day never cooled, so the drinks came to the shallow end."],"rescue":[null,null,null],"alreadyKept":[]},{"index":12,"image":"heat/week_2/night/6.webp","hash":"e62c00a72fb4","condition":"heat","time":"night","week":"A","day":"wed","paths":["heat/week_2/night/6.webp","heat/week_4/night/6.webp"],"why":"round-1 lines retired by the doctrine redo","place":null,"pass1":null,"seen":"A labrador lying flat on the cool bathroom tiles at night, freestanding bath behind, warm passage light falling across the floor. Wednesday.","note":null,"lines":["The lab did a full survey and the bathroom tiles won by two degrees.","Tile is the coldest surface in the house tonight, and it is taken.","The dog knows where the house keeps its last cool square metres."],"rescue":[null,null,null],"alreadyKept":[]}]};
const SRC_NAME = "review/set-001-lines-bespoke-heat-v3.json";
const EXPORT_NAME = "set-001-lines-bespoke-heat-v3-ruled.json";
// Namespaced per source. Round 1 and round 2 share this page's code, and with
// one key the round-2 page read round 1's saved text back out of storage and
// rendered it in every slot - Al opened it and saw the old lines. The stored
// value is keyed by image+index, and index 1 means a different line in each
// round, so the namespace is not optional.
const LS = 'pw_bespoke_lines_' + SRC_NAME.replace(/[^a-z0-9]+/gi, '_');
const state = JSON.parse(localStorage.getItem(LS) || '{}');
const $ = (id) => document.getElementById(id);
const key = (img, i) => img + '#' + i;
const wc = (s) => (s.trim() ? s.trim().split(/\s+/).length : 0);

function save() { localStorage.setItem(LS, JSON.stringify(state)); tally(); }

function tally() {
  let yes = 0, no = 0, mine = 0;
  for (const [k, v] of Object.entries(state)) {
    if (v.verdict === 'YES') yes += 1;
    if (v.verdict === 'NO') no += 1;
    if (k.endsWith('#5') && v.text && v.text.trim()) mine += 1;
  }
  const imagesWithAYes = new Set(Object.entries(state).filter(([, v]) => v.verdict === 'YES')
    .map(([k]) => k.split('#')[0])).size;
  $('tally').textContent = yes + ' ticked · ' + no + ' rejected · ' + mine + ' of your own · '
    + imagesWithAYes + '/' + DATA.images.length + ' images have at least one';
}

function render() {
  const m = $('main');
  m.innerHTML = '';
  for (const img of DATA.images) {
    const card = document.createElement('section');
    card.className = 'card';

    const hero = document.createElement('div');
    hero.className = 'hero';
    hero.style.width = DATA.box.w + 'px';
    hero.style.height = DATA.box.h + 'px';
    hero.style.backgroundImage = 'url("/assets/images/bg/' + img.image + '")';
    hero.style.backgroundPosition = 'center 50%';
    const cap = document.createElement('p');
    cap.className = 'cap';
    cap.style.padding = DATA.cap.runway.toFixed(1) + 'px 16px ' + DATA.cap.padBottom.toFixed(1) + 'px';
    cap.style.fontSize = DATA.cap.font.toFixed(1) + 'px';
    cap.style.background = 'linear-gradient(to top, rgba(0,0,0,.80) 0%, rgba(0,0,0,.62) calc(100% - '
      + DATA.cap.runway.toFixed(1) + 'px), rgba(0,0,0,0) 100%)';
    cap.style.borderRadius = '0 0 20px 20px';
    cap.textContent = img.lines[0];
    hero.appendChild(cap);
    card.appendChild(hero);

    const right = document.createElement('div');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = '<b>' + img.index + '. ' + img.condition + ' · ' + img.time + '</b> · ' + img.image
      + ' · ' + img.week + '/' + img.day + ' · ' + img.why + (img.pass1 ? ' · pass-1 ' + img.pass1 : '');
    right.appendChild(meta);

    const seen = document.createElement('p');
    seen.className = 'seen';
    seen.textContent = img.seen;
    right.appendChild(seen);

    if (img.note) {
      const n = document.createElement('p');
      n.className = 'note';
      n.textContent = img.note;
      right.appendChild(n);
    }

    // Lines already kept for this picture, locked and not re-litigated — the
    // point of round 2 is the gaps, and showing the survivors is what makes a
    // new line judgeable as part of a SET rather than on its own.
    if (img.alreadyKept && img.alreadyKept.length) {
      const box = document.createElement('div');
      box.className = 'meta';
      box.style.margin = '2px 0 10px';
      box.textContent = 'already kept (' + img.alreadyKept.length + '): ';
      for (const t of img.alreadyKept) {
        const b = document.createElement('div');
        b.style.cssText = 'color:#63c98a;font-size:12.5px;margin:2px 0 0 12px';
        b.textContent = '✓ ' + t;
        box.appendChild(b);
      }
      right.appendChild(box);
    }

    // The written candidates plus one empty slot for Al's own.
    const N = img.lines.length;
    for (let i = 0; i < N + 1; i += 1) {
      const k = key(img.image, i);
      const rec = state[k] || {};
      const wrap = document.createElement('div');
      wrap.className = 'line' + (i === N ? ' mine' : '');

      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = i === N ? '+' : String(i + 1);
      wrap.appendChild(n);

      const ref = img.rescue && img.rescue[i];
      if (ref) {
        const tag = document.createElement('span');
        tag.className = 'resc';
        tag.textContent = 'bank';
        tag.title = 'Rescued from the existing bank (' + ref + ') rather than newly written';
        wrap.appendChild(tag);
      }

      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = rec.text != null ? rec.text : (i < N ? img.lines[i] : '');
      if (i === N) inp.placeholder = 'your own line for this picture…';
      const count = document.createElement('span');
      count.className = 'wc';
      const paint = () => {
        cap.textContent = inp.value || img.lines[0];
        count.textContent = wc(inp.value) + 'w';
      };
      inp.addEventListener('focus', paint);
      inp.addEventListener('input', () => {
        state[k] = Object.assign({}, state[k], { text: inp.value });
        paint(); save();
      });
      wrap.appendChild(inp);
      count.textContent = wc(inp.value) + 'w';
      wrap.appendChild(count);

      const yes = document.createElement('button');
      yes.className = 'y' + (rec.verdict === 'YES' ? ' on' : '');
      yes.textContent = '✓';
      yes.title = 'keep this line for this picture';
      yes.onclick = () => {
        state[k] = Object.assign({}, state[k], { text: inp.value, verdict: rec.verdict === 'YES' ? null : 'YES' });
        save(); render();
      };
      const no = document.createElement('button');
      no.className = 'n2' + (rec.verdict === 'NO' ? ' on' : '');
      no.textContent = '✕';
      no.title = 'not for this picture';
      no.onclick = () => {
        state[k] = Object.assign({}, state[k], { text: inp.value, verdict: rec.verdict === 'NO' ? null : 'NO' });
        save(); render();
      };
      wrap.appendChild(yes);
      wrap.appendChild(no);
      right.appendChild(wrap);
    }

    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = 'Click into a line to see it on the picture. Edit the text freely — the edit is what exports. '
      + 'The dashed slot is yours.';
    right.appendChild(hint);
    card.appendChild(right);
    m.appendChild(card);
  }
  tally();
}

$('export').onclick = () => {
  const out = { generated: '2026-08-19', ruledBy: 'Al, bespoke line review', bucket: DATA.bucket || null, images: [] };
  for (const img of DATA.images) {
    const kept = []; const rejected = [];
    // Lines already kept in an earlier round ride along in the export, marked as
    // such: the file is the picture's whole approved set, not just this round's
    // additions, so nothing downstream has to join two exports to know the truth.
    for (const t of (img.alreadyKept || [])) kept.push({ text: t, source: 'bespoke', round: 1, edited: false });
    const N = img.lines.length;
    for (let i = 0; i < N + 1; i += 1) {
      const rec = state[key(img.image, i)] || {};
      const text = rec.text != null ? rec.text : (i < N ? img.lines[i] : '');
      if (!text || !text.trim()) continue;
      const entry = { text: text.trim(), source: i === N ? 'al' : 'bespoke',
        round: 2, edited: i < N && text.trim() !== img.lines[i] };
      const ref = img.rescue && img.rescue[i];
      if (ref && !entry.edited) { entry.source = 'bank'; entry.rescue = ref; }
      if (rec.verdict === 'YES') kept.push(entry);
      else if (rec.verdict === 'NO') rejected.push(entry);
    }
    out.images.push({ image: img.image, hash: img.hash, condition: img.condition, time: img.time,
      week: img.week, day: img.day, paths: img.paths, kept, rejected });
  }
  out.keptCount = out.images.reduce((n, i) => n + i.kept.length, 0);
  out.imagesWithNone = out.images.filter((i) => !i.kept.length).map((i) => i.image);
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = EXPORT_NAME;
  a.click();
};

render();
</script>
